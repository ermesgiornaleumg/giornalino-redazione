<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Pannello Redazione - Ermes UMG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Quill.js Editor -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans flex flex-col justify-between">

  <!-- Schermata di Login -->
  <div id="loginScreen" class="flex flex-col items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200 text-center">
      <div class="flex justify-center mb-4">
        <img src="https://www.ermes-umg.it/favicon.ico" alt="Ermes UMG Logo" class="h-16 w-16 object-contain rounded-xl shadow-sm border border-slate-100 p-1">
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Redazione Ermes UMG</h1>
      <p class="text-slate-500 text-sm mt-1 mb-4">Accedi per gestire articoli, prenotazioni e comunicati</p>

      <!-- TEST CONNESSIONE SERVER -->
      <div class="mb-4 p-3 bg-slate-50 border rounded-lg text-xs text-left">
        <button type="button" onclick="testConnection()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold py-1 rounded transition mb-1">
          🔍 Test Connessione Server
        </button>
        <p id="testStatus" class="text-[11px] text-slate-500 font-mono italic">Clicca per testare la comunicazione con Cloudflare...</p>
      </div>

      <form id="loginForm" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Username</label>
          <input type="text" id="username" required placeholder="es. admin o bruno.rachiele" class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Password</label>
          <input type="password" id="password" required class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>
        <p id="loginError" class="text-red-500 text-xs hidden text-center font-medium"></p>
        <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow-sm">Accedi</button>
      </form>

      <div class="mt-8 pt-4 border-t border-slate-100 text-xs text-slate-400">
        <p>Creato da <span class="font-semibold text-slate-600">Bruno Rachiele</span></p>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://white-sky-0801.ermesgiornale-umg.workers.dev/";
    let users = null;

    async function testConnection() {
      const status = document.getElementById("testStatus");
      status.innerText = "Connessione in corso a " + WORKER_URL + "users ...";
      try {
        const res = await fetch(WORKER_URL + "users");
        const data = await res.json();
        if (data.users) {
          users = data.users;
          status.innerHTML = "<span class='text-emerald-600 font-bold'>✓ Server Online!</span> Utenti trovati: " + Object.keys(users).length;
        } else {
          status.innerHTML = "<span class='text-amber-600 font-bold'>⚠️ Risposta del server non valida:</span> " + JSON.stringify(data);
        }
      } catch(e) {
        status.innerHTML = "<span class='text-red-600 font-bold'>❌ Errore Connessione:</span> " + e.message;
      }
    }

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const errBox = document.getElementById("loginError");
      const btn = document.getElementById("loginBtn");
      errBox.classList.add("hidden");
      btn.disabled = true;
      btn.innerText = "Verifica in corso...";

      const u = document.getElementById("username").value.trim().toLowerCase();
      const p = document.getElementById("password").value.trim();

      try {
        const res = await fetch(WORKER_URL + "users");
        const data = await res.json();
        
        if (data.users) {
          users = data.users;
        } else {
          throw new Error("Impossibile scaricare la lista utenti dal server.");
        }

        if (users[u] && users[u].pass === p) {
          alert("✓ Login effettuato con successo come " + users[u].name + "!");
        } else {
          errBox.innerText = "Credenziali non valide. Controlla username e password.";
          errBox.classList.remove("hidden");
        }
      } catch(e) {
        errBox.innerText = "Errore di comunicazione: " + e.message;
        errBox.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.innerText = "Accedi";
      }
    });
  </script>
</body>
</html>
