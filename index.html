<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Area Redazione - Giornalino Universitario</title>
  <!-- Tailwind CSS per la grafica -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Quill.js Editor (WYSIWYG) -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800">

  <!-- SEZIONE LOGIN -->
  <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Area Autori</h1>
        <p class="text-sm text-slate-500 mt-1">Accedi per inviare le tue bozze al giornalino</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Username / Email</label>
          <input type="text" id="usernameInput" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" id="passwordInput" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
        </div>
        <div id="loginError" class="text-red-500 text-xs hidden">Credenziali non valide. Riprova.</div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors duration-200 text-sm shadow-md">
          Accedi
        </button>
      </form>
    </div>
  </div>

  <!-- SEZIONE DASHBOARD / EDITOR (Nascosta inizialmente) -->
  <div id="editorSection" class="hidden">
    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm">
      <div class="flex items-center gap-3">
        <span class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xs">UMG</span>
        <h2 class="font-bold text-slate-800 text-lg">Pannello Redazione</h2>
      </div>
      <div class="flex items-center gap-4">
        <span id="userBadge" class="text-xs font-semibold bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full border">
          Utente: <span id="loggedUser">Autore</span>
        </span>
        <button onclick="handleLogout()" class="text-xs text-red-600 hover:text-red-800 font-medium transition">
          Esci
        </button>
      </div>
    </nav>

    <!-- Form Stesura Articolo -->
    <main class="max-w-4xl mx-auto my-8 p-6 bg-white rounded-xl shadow-md border border-slate-200">
      <h2 class="text-xl font-bold mb-4 text-slate-800">Crea un nuovo articolo</h2>

      <!-- Input Titolo -->
      <div class="mb-5">
        <label for="postTitle" class="block text-sm font-medium text-slate-700 mb-2">Titolo dell'articolo</label>
        <input type="text" id="postTitle" placeholder="Inserisci il titolo dell'articolo..." class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium text-slate-800 text-base">
      </div>

      <!-- Editor WYSIWYG -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-700 mb-2">Contenuto dell'articolo</label>
        <div id="editorContainer" class="h-80 bg-white rounded-b-lg"></div>
      </div>

      <!-- Stato e Pulsanti -->
      <div class="flex items-center justify-between border-t pt-4">
        <div id="statusMessage" class="text-sm font-medium"></div>
        <button onclick="saveDraft()" id="saveBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-lg font-medium text-sm transition shadow-md flex items-center gap-2">
          <span>Invia in Bozza su Blogger</span>
        </button>
      </div>
    </main>
  </div>

  <script>
    // Inizializzazione Editor Quill
    let quill;
    document.addEventListener("DOMContentLoaded", function () {
      quill = new Quill('#editorContainer', {
        theme: 'snow',
        placeholder: 'Scrivi qui il tuo articolo...',
        modules: {
          toolbar: [
            [{ 'header': [1, 2, 3, false] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            ['link', 'image', 'blockquote', 'code-block'],
            [{ 'color': [] }, { 'background': [] }],
            ['clean']
          ]
        }
      });
    });

    // Database Utenti Temporaneo (Sostituibile in seguito con DB o Backend)
    const USERS_DB = {
      "autore1": "pass123",
      "redazione.umg": "giornalino2026",
      "student.editor": "umg2026"
    };

    // Gestione Login
    function handleLogin(event) {
      event.preventDefault();
      const user = document.getElementById("usernameInput").value.trim();
      const pass = document.getElementById("passwordInput").value.trim();

      if (USERS_DB[user] && USERS_DB[user] === pass) {
        localStorage.setItem("giornalino_user", user);
        showDashboard(user);
      } else {
        document.getElementById("loginError").classList.remove("hidden");
      }
    }

    function showDashboard(username) {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("editorSection").classList.remove("hidden");
      document.getElementById("loggedUser").innerText = username;
    }

    function handleLogout() {
      localStorage.removeItem("giornalino_user");
      location.reload();
    }

    // Auto-login se già autenticato
    const savedUser = localStorage.getItem("giornalino_user");
    if (savedUser) {
      showDashboard(savedUser);
    }

    // Funzione Invio Bozza a Blogger
    async function saveDraft() {
      const title = document.getElementById("postTitle").value.trim();
      const content = quill.root.innerHTML;
      const statusMsg = document.getElementById("statusMessage");
      const saveBtn = document.getElementById("saveBtn");

      if (!title || quill.getText().trim().length === 0) {
        statusMsg.className = "text-sm font-medium text-amber-600";
        statusMsg.innerText = "Inserisci sia il titolo che il testo prima di inviare.";
        return;
      }

      statusMsg.className = "text-sm font-medium text-blue-600";
      statusMsg.innerText = "Invio della bozza in corso...";
      saveBtn.disabled = true;

      try {
        // Qui collegheremo la chiamata al nostro Worker/Proxy Serverless
        // Esempio temporaneo di verifica dell'invio:
        console.log("Titolo:", title);
        console.log("Contenuto HTML:", content);

        setTimeout(() => {
          statusMsg.className = "text-sm font-medium text-emerald-600";
          statusMsg.innerText = "✓ Bozza salvata con successo su Blogger!";
          saveBtn.disabled = false;
          // Resetta i campi
          document.getElementById("postTitle").value = "";
          quill.setContents([]);
        }, 1500);

      } catch (err) {
        statusMsg.className = "text-sm font-medium text-red-600";
        statusMsg.innerText = "Errore durante il salvataggio della bozza.";
        saveBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
