<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pannello Redazione - Ermes UMG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Quill.js Editor -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- Schermata di Login -->
  <div id="loginScreen" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Redazione Ermes UMG</h1>
        <p class="text-slate-500 text-sm mt-1">Accedi per creare e inviare le tue bozze</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Username</label>
          <input type="text" id="username" required placeholder="es. bruno.rachiele" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Password</label>
          <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <p id="loginError" class="text-red-500 text-xs hidden text-center">Credenziali non valide.</p>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">Accedi</button>
      </form>
    </div>
  </div>

  <!-- Dashboard Redazione -->
  <div id="dashboardScreen" class="hidden">
    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
      <div class="flex items-center space-x-3">
        <span class="font-bold text-lg text-slate-900">Ermes UMG</span>
        <span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded-full font-medium">Pannello Redattori</span>
      </div>
      <div class="flex items-center space-x-4">
        <span id="userInfo" class="text-sm font-medium text-slate-600"></span>
        <button onclick="logout()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-md transition">Esci</button>
      </div>
    </nav>

    <!-- Area Editor -->
    <main class="max-w-4xl mx-auto my-8 p-6 bg-white rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-xl font-bold text-slate-900 mb-4">Nuovo Articolo</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Titolo dell'articolo</label>
          <input type="text" id="postTitle" placeholder="Inserisci il titolo..." class="w-full text-lg px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-semibold">
        </div>

        <!-- Categorie dinamiche da Blogger, Autore e Co-Autori -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Categoria / Tag Principale</label>
            <select id="postCategory" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white text-sm">
              <option value="">Caricamento tag in corso...</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Autore Principale</label>
            <input type="text" id="authorTagDisplay" disabled class="w-full px-4 py-2 border rounded-lg bg-slate-50 text-slate-500 font-medium cursor-not-allowed text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Co-Autori / Collaboratori</label>
            <select id="coAuthorsSelect" multiple class="w-full px-3 py-1.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white text-sm h-24">
            </select>
            <p class="text-[10px] text-slate-400 mt-1">Tieni premuto CTRL / CMD per Selezionare più autori.</p>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Contenuto dell'articolo</label>
          <div id="editor" class="h-80 bg-white"></div>
        </div>

        <!-- Bar Azioni -->
        <div class="flex items-center justify-between pt-4 border-t border-slate-100">
          <span id="statusMessage" class="text-sm font-medium"></span>
          <button id="saveBtn" onclick="saveDraft()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2.5 rounded-lg shadow-sm transition flex items-center space-x-2">
            <span>Invia in Bozza su Blogger</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const WORKER_URL = "https://white-sky-0801.ermesgiornale-umg.workers.dev/";

    // Database Completo degli Autori e Link ufficiali
    const users = {
      "alessia.screnci": { pass: "pass123", name: "Alessia Screnci", link: "https://www.ermes-umg.it/p/alessia-screnci.html" },
      "elisabeth.rosano": { pass: "pass123", name: "Elisabeth Rosanò", link: "https://www.ermes-umg.it/p/elisabeth-rosano.html" },
      "giulia.dagostino": { pass: "pass123", name: "Giulia D'Agostino", link: "https://www.ermes-umg.it/p/giulia-dagostino.html" },
      "alessio.mancuso": { pass: "pass123", name: "Alessio Carmine Mancuso", link: "https://www.ermes-umg.it/p/box-autore.html" },
      "virginia.lacroce": { pass: "pass123", name: "Maria Virginia La Croce", link: "https://www.ermes-umg.it/p/maria-virginia-lacroce.html" },
      "giuseppe.agostino": { pass: "pass123", name: "Giuseppe Agostino", link: "https://www.ermes-umg.it/p/giuseppe-agostino.html" },
      "thomas.lepera": { pass: "pass123", name: "Thomas Le Pera", link: "https://www.ermes-umg.it/p/thomas-la-pera.html" },
      "niccolo.ruscelli": { pass: "pass123", name: "Niccolò Ruscelli", link: "https://www.ermes-umg.it/p/niccolo-ruscelli.html" },
      "aurelia.mangone": { pass: "pass123", name: "Aurelia Mangone", link: "https://www.ermes-umg.it/p/aurelia-mangone.html" },
      "veronica.vecchio": { pass: "pass123", name: "Veronica Vecchio", link: "https://www.ermes-umg.it/p/veronica-vecchio.html" },
      "riccardo.mangone": { pass: "pass123", name: "Riccardo Mangone", link: "https://www.ermes-umg.it/p/riccardo-mangone.html" },
      "benedetta.punturiero": { pass: "pass123", name: "Benedetta Punturiero", link: "https://www.ermes-umg.it/p/benedetta-punturiero.html" },
      "domenica.leuzzi": { pass: "pass123", name: "Domenica Pia Leuzzi", link: "https://www.ermes-umg.it/p/domenica-pia-leuzzi.html" },
      "chiara.navarra": { pass: "pass123", name: "Chiara Navarra", link: "https://www.ermes-umg.it/p/chiara-navarra.html" },
      "antongiulio.iorfida": { pass: "pass123", name: "Antongiulio Iorfida", link: "https://www.ermes-umg.it/p/antongiulio-iofida.html" },
      "lara.cosentino": { pass: "pass123", name: "Lara Cosentino", link: "https://www.ermes-umg.it/p/lara-cosentino.html" },
      "francesca.romeo": { pass: "pass123", name: "Francesca Romeo", link: "https://www.ermes-umg.it/p/francesca-romeo.html" },
      "bruno.rachiele": { pass: "pass123", name: "Bruno Rachiele", link: "https://www.ermes-umg.it/p/bruno-rachiele.html" }
    };

    let currentUser = null;

    // Inizializzazione Editor Quill.js
    const quill = new Quill('#editor', {
      theme: 'snow',
      modules: {
        toolbar: [
          [{ 'header': [1, 2, 3, false] }],
          ['bold', 'italic', 'underline', 'strike'],
          [{ 'list': 'ordered'}, { 'list': 'bullet' }],
          ['link', 'image'],
          ['clean']
        ]
      }
    });

    // Recupera in tempo reale tutti i tag esistenti da Blogger
    async function loadBloggerTags() {
      const select = document.getElementById("postCategory");
      try {
        const res = await fetch(WORKER_URL);
        const data = await res.json();
        
        select.innerHTML = "";
        
        if (data.labels && data.labels.length > 0) {
          data.labels.forEach(tag => {
            // Escludiamo le etichette autore dal menu delle categorie
            if (!tag.startsWith("Autore:")) {
              const opt = document.createElement("option");
              opt.value = tag;
              opt.innerText = tag;
              select.appendChild(opt);
            }
          });
        } else {
          select.innerHTML = '<option value="attualità">attualità</option><option value="Cultura">Cultura</option><option value="università">università</option>';
        }
      } catch(e) {
        select.innerHTML = '<option value="attualità">attualità</option><option value="Cultura">Cultura</option><option value="università">università</option>';
      }
    }

    // Login logic
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const u = document.getElementById("username").value.trim().toLowerCase();
      const p = document.getElementById("password").value.trim();

      if (users[u] && users[u].pass === p) {
        currentUser = users[u];
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("dashboardScreen").classList.remove("hidden");
        document.getElementById("userInfo").innerText = "Autore: " + currentUser.name;
        document.getElementById("authorTagDisplay").value = currentUser.name;
        document.getElementById("loginError").classList.add("hidden");

        populateCoAuthorsList();
        loadBloggerTags();
      } else {
        document.getElementById("loginError").classList.remove("hidden");
      }
    });

    function populateCoAuthorsList() {
      const coAuthorsSelect = document.getElementById("coAuthorsSelect");
      coAuthorsSelect.innerHTML = "";
      
      Object.keys(users).forEach(key => {
        if (users[key].name !== currentUser.name) {
          const opt = document.createElement("option");
          opt.value = key;
          opt.innerText = users[key].name;
          coAuthorsSelect.appendChild(opt);
        }
      });
    }

    function logout() {
      currentUser = null;
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("dashboardScreen").classList.add("hidden");
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
    }

    // Invio articolo a Blogger
    async function saveDraft() {
      const title = document.getElementById("postTitle").value.trim();
      let rawContent = quill.root.innerHTML;
      const category = document.getElementById("postCategory").value;
      const statusMsg = document.getElementById("statusMessage");
      const saveBtn = document.getElementById("saveBtn");

      if (!title || quill.getText().trim().length === 0) {
        statusMsg.className = "text-sm font-medium text-amber-600";
        statusMsg.innerText = "Inserisci sia il titolo che il testo prima di inviare.";
        return;
      }

      // Recuperiamo i co-autori selezionati
      const coAuthorsSelect = document.getElementById("coAuthorsSelect");
      const selectedCoAuthorKeys = Array.from(coAuthorsSelect.selectedOptions).map(opt => opt.value);

      // Creazione dicitura ipertestuale "Scritto da..."
      let byline = `<p><em><strong>Scritto da <a href="${currentUser.link}" target="_blank">${currentUser.name}</a></strong>`;
      
      const labels = [category, currentUser.name, "Autore: " + currentUser.name];

      if (selectedCoAuthorKeys.length > 0) {
        const coAuthorsLinks = selectedCoAuthorKeys.map(key => {
          const coAuthor = users[key];
          labels.push(coAuthor.name);
          labels.push("Autore: " + coAuthor.name);
          return `<a href="${coAuthor.link}" target="_blank">${coAuthor.name}</a>`;
        });
        byline += ` in collaborazione con ${coAuthorsLinks.join(", ")}`;
      }
      
      byline += `</em></p><hr><br>`;

      const finalContent = byline + rawContent;

      statusMsg.className = "text-sm font-medium text-blue-600";
      statusMsg.innerText = "Invio della bozza in corso...";
      saveBtn.disabled = true;

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, content: finalContent, labels })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          statusMsg.className = "text-sm font-medium text-emerald-600";
          statusMsg.innerText = "✓ Bozza salvata con successo su Blogger!";
          document.getElementById("postTitle").value = "";
          quill.setContents([]);
          coAuthorsSelect.selectedIndex = -1;
        } else {
          statusMsg.className = "text-sm font-medium text-red-600";
          statusMsg.innerText = "Errore: " + (result.error || "Impossibile salvare la bozza.");
        }
      } catch (err) {
        statusMsg.className = "text-sm font-medium text-red-600";
        statusMsg.innerText = "Errore di connessione con il server.";
      } finally {
        saveBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
