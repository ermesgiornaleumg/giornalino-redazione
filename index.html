<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pannello Redazione - Ermes UMG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Quill.js Editor -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- Schermata di Login -->
  <div id="loginScreen" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Redazione Ermes UMG</h1>
        <p class="text-slate-500 text-sm mt-1">Accedi per creare e inviare le tue bozze</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Username</label>
          <input type="text" id="username" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Password</label>
          <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <p id="loginError" class="text-red-500 text-xs hidden text-center">Credenziali non valide.</p>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">Accedi</button>
      </form>
    </div>
  </div>

  <!-- Dashboard Redazione (Nascosta prima del login) -->
  <div id="dashboardScreen" class="hidden">
    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
      <div class="flex items-center space-x-3">
        <span class="font-bold text-lg text-slate-900">Ermes UMG</span>
        <span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded-full font-medium">Dashboard Autore</span>
      </div>
      <div class="flex items-center space-x-4">
        <span id="userInfo" class="text-sm font-medium text-slate-600"></span>
        <button onclick="logout()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-md transition">Esci</button>
      </div>
    </nav>

    <!-- Area Editor -->
    <main class="max-w-4xl mx-auto my-8 p-6 bg-white rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-xl font-bold text-slate-900 mb-4">Nuovo Articolo</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Titolo dell'articolo</label>
          <input type="text" id="postTitle" placeholder="Inserisci il titolo..." class="w-full text-lg px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-semibold">
        </div>

        <!-- Categoria, Autore Principale e Co-Autori -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Categoria / Sezione</label>
            <select id="postCategory" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
              <option value="Universita">Università</option>
              <option value="Attualita">Attualità</option>
              <option value="Cultura">Cultura</option>
              <option value="Sport">Sport</option>
              <option value="Eventi">Eventi</option>
              <option value="Opinioni">Opinioni</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Autore Principale</label>
            <input type="text" id="authorTagDisplay" disabled class="w-full px-4 py-2 border rounded-lg bg-slate-50 text-slate-500 font-medium cursor-not-allowed">
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Collaboratori / Co-Autori</label>
            <select id="coAuthorsSelect" multiple class="w-full px-3 py-1.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white text-sm h-20">
              <!-- I co-autori verranno caricati dinamicamente -->
            </select>
            <p class="text-[10px] text-slate-400 mt-1">Tieni premuto CTRL (o CMD) per selezionare più collaboratori.</p>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Contenuto (Caricamento foto disponibile nella barra)</label>
          <div id="editor" class="h-80 bg-white"></div>
        </div>

        <!-- Bar Azioni -->
        <div class="flex items-center justify-between pt-4 border-t border-slate-100">
          <span id="statusMessage" class="text-sm font-medium"></span>
          <button id="saveBtn" onclick="saveDraft()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2.5 rounded-lg shadow-sm transition flex items-center space-x-2">
            <span>Invia in Bozza su Blogger</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Elenco Utenti Redazione
    const users = {
      "autore1": { pass: "pass123", name: "Marco Rossi" },
      "autore2": { pass: "pass123", name: "Giulia Bianchi" },
      "autore3": { pass: "pass123", name: "Luca Verdi" }
    };

    let currentUser = null;

    // Inizializzazione Editor Quill
    const quill = new Quill('#editor', {
      theme: 'snow',
      modules: {
        toolbar: {
          container: [
            [{ 'header': [1, 2, 3, false] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            ['link', 'image'],
            ['clean']
          ]
        }
      }
    });

    // Gestione Login
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value.trim();

      if (users[u] && users[u].pass === p) {
        currentUser = users[u];
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("dashboardScreen").classList.remove("hidden");
        document.getElementById("userInfo").innerText = "Autore: " + currentUser.name;
        document.getElementById("authorTagDisplay").value = currentUser.name;
        document.getElementById("loginError").classList.add("hidden");

        // Popoliamo la lista dei co-autori escludendo l'utente corrente
        populateCoAuthorsList();
      } else {
        document.getElementById("loginError").classList.remove("hidden");
      }
    });

    function populateCoAuthorsList() {
      const coAuthorsSelect = document.getElementById("coAuthorsSelect");
      coAuthorsSelect.innerHTML = "";
      
      Object.keys(users).forEach(key => {
        if (users[key].name !== currentUser.name) {
          const opt = document.createElement("option");
          opt.value = users[key].name;
          opt.innerText = users[key].name;
          coAuthorsSelect.appendChild(opt);
        }
      });
    }

    function logout() {
      currentUser = null;
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("dashboardScreen").classList.add("hidden");
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
    }

    // Invio articolo a Blogger
    async function saveDraft() {
      const title = document.getElementById("postTitle").value.trim();
      let rawContent = quill.root.innerHTML;
      const category = document.getElementById("postCategory").value;
      const statusMsg = document.getElementById("statusMessage");
      const saveBtn = document.getElementById("saveBtn");

      if (!title || quill.getText().trim().length === 0) {
        statusMsg.className = "text-sm font-medium text-amber-600";
        statusMsg.innerText = "Inserisci sia il titolo che il testo prima di inviare.";
        return;
      }

      // Recuperiamo i collaboratori selezionati
      const coAuthorsSelect = document.getElementById("coAuthorsSelect");
      const selectedCoAuthors = Array.from(coAuthorsSelect.selectedOptions).map(opt => opt.value);

      // Generazione dicitura "Scritto da ..." in cima al testo
      let byline = `<p><em><strong>Scritto da ${currentUser.name}</strong>`;
      if (selectedCoAuthors.length > 0) {
        byline += ` in collaborazione con ${selectedCoAuthors.join(", ")}`;
      }
      byline += `</em></p><hr><br>`;

      // Uniamo la dicitura automatica con il contenuto inserito dall'autore
      const finalContent = byline + rawContent;

      // Generiamo l'array delle etichette (categoria + autore principale + collaboratori)
      const labels = [category, "Autore: " + currentUser.name];
      selectedCoAuthors.forEach(coAuthor => {
        labels.push("Autore: " + coAuthor);
      });

      statusMsg.className = "text-sm font-medium text-blue-600";
      statusMsg.innerText = "Invio della bozza in corso...";
      saveBtn.disabled = true;

      try {
        const WORKER_URL = "https://white-sky-0801.ermesgiornale-umg.workers.dev/";

        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, content: finalContent, labels })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          statusMsg.className = "text-sm font-medium text-emerald-600";
          statusMsg.innerText = "✓ Bozza salvata con successo con intestazione e tag autori!";
          document.getElementById("postTitle").value = "";
          quill.setContents([]);
          coAuthorsSelect.selectedIndex = -1;
        } else {
          statusMsg.className = "text-sm font-medium text-red-600";
          statusMsg.innerText = "Errore: " + (result.error || "Impossibile salvare la bozza.");
        }
      } catch (err) {
        statusMsg.className = "text-sm font-medium text-red-600";
        statusMsg.innerText = "Errore di connessione con il server.";
      } finally {
        saveBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
